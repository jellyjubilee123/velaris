services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: velaris
      POSTGRES_PASSWORD: velaris
      POSTGRES_DB: velaris
    ports:
      - "5432:5432"
    volumes:
      - velaris_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://velaris:velaris@db:5432/velaris
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  velaris_pgdata:
